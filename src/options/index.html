<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect Paperclip – Options</title>
    <link rel="stylesheet" href="../shared/ui.css" />
  </head>
  <body>
    <main class="page">
      <h1>Connect Paperclip</h1>
      <p class="muted">Hover definitions for metric labels on the Amazon Connect Customer admin website.</p>

      <form id="form">
        <label class="row">
          <input type="checkbox" name="enabled" />
          <span><strong>Enabled</strong><br /><small>Turn tooltips on or off on all Connect pages.</small></span>
        </label>

        <label class="row">
          <input type="checkbox" name="underline" />
          <span><strong>Underline matched labels</strong><br /><small>Dotted underline shows which labels have a definition.</small></span>
        </label>

        <label class="row">
          <input type="checkbox" name="flowLinks" />
          <span><strong>Open flow links in the flow editor</strong><br /><small>Adds an Open flow link under flow pickers in a block's settings panel.</small></span>
        </label>

        <label class="row">
          <span class="grow"><strong>Hover delay</strong><br /><small>Milliseconds before the tooltip opens.</small></span>
          <input type="number" name="hoverDelay" min="0" max="3000" step="50" class="num" />
        </label>

      </form>

      <p id="status" class="muted" role="status"></p>

      <section class="about">
        <h2>Data</h2>
        <p id="data" class="muted"></p>
        <p><a id="docsLink" href="https://docs.aws.amazon.com/connect/latest/adminguide/metrics-definitions.html" target="_blank" rel="noopener noreferrer">AWS metric definitions ↗</a></p>
      </section>
    </main>
    <script type="module" src="./options.ts"></script>
  </body>
</html>
